<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Buttons, Functions, and More</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Assignment 5</h1>
        <h2>Introduction to JavaScript</h2>

        <section id="columns">
            <section class="box" id="speech-box">
                <p class="dots">...</p>
                <h3>Speech</h3>
                <div id="speech"></div>
            </section>

            <section class="box">
                <p class="dots">...</p>
                <h3>Beverage</h3>
                <p>Pick your morning beverage:</p>
                <select id="beverage">
                    <option value="">Choose one</option>
                    <option value="Coffee">Coffee</option>
                    <option value="Orange Juice">Orange Juice</option>
                    <option value="Tea">Tea</option>
                </select>
                <p id="beverage-message"></p>
            </section>

            <section class="box" id="sticker-box">
                <p class="dots">...</p>
                <h3>Add a Sticker</h3>
                <img id="sun" src="Images/sun3.jpg" alt="Smiling Sun">
                <span id="sticker">🌞</span>
            </section>
        </section>
        
        <p class="footer">&copy;akshithkaranam</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
